<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EventHub – Events</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    body { background: #f8f9fa; }
    .page-header { background: linear-gradient(135deg,#1a1a2e,#0f3460); color:#fff; padding:40px 0 30px; }
    .table th { background:#0f3460; color:#fff; }
    .btn-action { padding:3px 10px; font-size:.8rem; }
  </style>
</head>
<body>

  <nav class="navbar navbar-dark" style="background:#1a1a2e;">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-calendar-event me-2"></i>EventHub</a>
      <div class="d-flex gap-2">
        <a href="events.html" class="btn btn-warning btn-sm">Events</a>
        <a href="users.html" class="btn btn-outline-light btn-sm">Users</a>
        <a href="subscriptions.html" class="btn btn-outline-light btn-sm">Subscriptions</a>
        <a href="administrators.html" class="btn btn-outline-light btn-sm">Admins</a>
      </div>
    </div>
  </nav>

  <div class="page-header">
    <div class="container">
      <h2><i class="bi bi-calendar3 me-2"></i>Events</h2>
      <p class="mb-0 opacity-75">Manage all platform events &mdash; Author: Syed Rayan Hashmi (ID: 764000072)</p>
    </div>
  </div>

  <div class="container py-4">

    <!-- Toast -->
    <div class="position-fixed top-0 end-0 p-3" style="z-index:9999">
      <div id="toast" class="toast align-items-center text-white border-0" role="alert">
        <div class="d-flex">
          <div class="toast-body" id="toast-msg"></div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <div class="input-group" style="max-width:340px;">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input type="text" id="searchInput" class="form-control" placeholder="Search by title..." oninput="searchEvents()"/>
        <button class="btn btn-outline-secondary" onclick="loadEvents()">Clear</button>
      </div>
      <button class="btn btn-warning fw-semibold" onclick="openModal()"><i class="bi bi-plus-lg me-1"></i>Add Event</button>
    </div>

    <!-- Loading spinner -->
    <div id="spinner" class="text-center py-5"><div class="spinner-border text-warning"></div></div>

    <!-- Table -->
    <div class="card shadow-sm d-none" id="tableCard">
      <div class="card-body p-0">
        <table class="table table-hover mb-0 align-middle">
          <thead>
            <tr>
              <th>ID</th><th>Title</th><th>Description</th><th>Date</th><th>Location</th><th>Actions</th>
            </tr>
          </thead>
          <tbody id="eventsTable"></tbody>
        </table>
      </div>
    </div>
    <div id="emptyMsg" class="text-center text-muted py-5 d-none">No events found.</div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="eventModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header" style="background:#0f3460; color:#fff;">
          <h5 class="modal-title" id="modalTitle">Add Event</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="eventId"/>
          <div class="mb-3">
            <label class="form-label fw-semibold">Title *</label>
            <input type="text" id="fTitle" class="form-control" placeholder="Event title" required/>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Description</label>
            <textarea id="fDesc" class="form-control" rows="2" placeholder="Short description"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Date</label>
            <input type="date" id="fDate" class="form-control"/>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Location</label>
            <input type="text" id="fLocation" class="form-control" placeholder="e.g. Main Hall"/>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-warning fw-semibold" onclick="saveEvent()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API = '/api/events';
    let modal, toast;

    document.addEventListener('DOMContentLoaded', () => {
      modal = new bootstrap.Modal(document.getElementById('eventModal'));
      toast = new bootstrap.Toast(document.getElementById('toast'));
      loadEvents();
    });

    function showToast(msg, type = 'success') {
      const el = document.getElementById('toast');
      el.className = `toast align-items-center text-white border-0 bg-${type}`;
      document.getElementById('toast-msg').textContent = msg;
      toast.show();
    }

    async function loadEvents() {
      document.getElementById('searchInput').value = '';
      document.getElementById('spinner').classList.remove('d-none');
      document.getElementById('tableCard').classList.add('d-none');
      document.getElementById('emptyMsg').classList.add('d-none');
      try {
        const res = await fetch(API);
        const data = await res.json();
        renderTable(data);
      } catch {
        showToast('Failed to load events.', 'danger');
      }
    }

    async function searchEvents() {
      const q = document.getElementById('searchInput').value.trim();
      if (!q) { loadEvents(); return; }
      try {
        const res = await fetch(`${API}/search?title=${encodeURIComponent(q)}`);
        const data = await res.json();
        renderTable(data);
      } catch {
        showToast('Search failed.', 'danger');
      }
    }

    function renderTable(data) {
      document.getElementById('spinner').classList.add('d-none');
      if (!data.length) {
        document.getElementById('emptyMsg').classList.remove('d-none');
        return;
      }
      document.getElementById('tableCard').classList.remove('d-none');
      document.getElementById('eventsTable').innerHTML = data.map(e => `
        <tr>
          <td>${e.id}</td>
          <td class="fw-semibold">${e.title}</td>
          <td class="text-muted small">${e.description || '—'}</td>
          <td>${e.date || '—'}</td>
          <td>${e.location || '—'}</td>
          <td>
            <button class="btn btn-outline-primary btn-action me-1" onclick="editEvent(${e.id})"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-outline-danger btn-action" onclick="deleteEvent(${e.id})"><i class="bi bi-trash"></i></button>
          </td>
        </tr>`).join('');
    }

    function openModal(event = null) {
      document.getElementById('modalTitle').textContent = event ? 'Edit Event' : 'Add Event';
      document.getElementById('eventId').value = event?.id || '';
      document.getElementById('fTitle').value = event?.title || '';
      document.getElementById('fDesc').value = event?.description || '';
      document.getElementById('fDate').value = event?.date || '';
      document.getElementById('fLocation').value = event?.location || '';
      modal.show();
    }

    async function editEvent(id) {
      const res = await fetch(`${API}/${id}`);
      const e = await res.json();
      openModal(e);
    }

    async function saveEvent() {
      const id = document.getElementById('eventId').value;
      const body = {
        title: document.getElementById('fTitle').value,
        description: document.getElementById('fDesc').value,
        date: document.getElementById('fDate').value,
        location: document.getElementById('fLocation').value
      };
      if (!body.title) { alert('Title is required.'); return; }
      try {
        const res = await fetch(id ? `${API}/${id}` : API, {
          method: id ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error();
        modal.hide();
        showToast(id ? 'Event updated!' : 'Event created!');
        loadEvents();
      } catch {
        showToast('Save failed.', 'danger');
      }
    }

    async function deleteEvent(id) {
      if (!confirm('Delete this event?')) return;
      try {
        const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error();
        showToast('Event deleted!', 'warning');
        loadEvents();
      } catch {
        showToast('Delete failed.', 'danger');
      }
    }
  </script>
</body>
</html>
