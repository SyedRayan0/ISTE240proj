<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EventHub – Administrators</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    body { background:#f8f9fa; }
    .page-header { background:linear-gradient(135deg,#1a1a2e,#dc3545); color:#fff; padding:40px 0 30px; }
    .table th { background:#dc3545; color:#fff; }
    .btn-action { padding:3px 10px; font-size:.8rem; }
  </style>
</head>
<body>

  <nav class="navbar navbar-dark" style="background:#1a1a2e;">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-calendar-event me-2"></i>EventHub</a>
      <div class="d-flex gap-2">
        <a href="events.html" class="btn btn-outline-light btn-sm">Events</a>
        <a href="users.html" class="btn btn-outline-light btn-sm">Users</a>
        <a href="subscriptions.html" class="btn btn-outline-light btn-sm">Subscriptions</a>
        <a href="administrators.html" class="btn btn-danger btn-sm">Admins</a>
      </div>
    </div>
  </nav>

  <div class="page-header">
    <div class="container">
      <h2><i class="bi bi-shield-lock me-2"></i>Administrators</h2>
      <p class="mb-0 opacity-75">Manage admin accounts &mdash; Author: Ali Faisal (ID: 415002117)</p>
    </div>
  </div>

  <div class="container py-4">

    <div class="position-fixed top-0 end-0 p-3" style="z-index:9999">
      <div id="toast" class="toast align-items-center text-white border-0" role="alert">
        <div class="d-flex">
          <div class="toast-body" id="toast-msg"></div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <div class="input-group" style="max-width:340px;">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input type="text" id="searchInput" class="form-control" placeholder="Search by department..." oninput="searchAdmins()"/>
        <button class="btn btn-outline-secondary" onclick="loadAdmins()">Clear</button>
      </div>
      <button class="btn btn-danger fw-semibold" onclick="openModal()"><i class="bi bi-plus-lg me-1"></i>Add Administrator</button>
    </div>

    <div id="spinner" class="text-center py-5"><div class="spinner-border text-danger"></div></div>

    <div class="card shadow-sm d-none" id="tableCard">
      <div class="card-body p-0">
        <table class="table table-hover mb-0 align-middle">
          <thead>
            <tr><th>ID</th><th>Admin ID</th><th>Access Level</th><th>Department</th><th>Actions</th></tr>
          </thead>
          <tbody id="adminsTable"></tbody>
        </table>
      </div>
    </div>
    <div id="emptyMsg" class="text-center text-muted py-5 d-none">No administrators found.</div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="adminModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title" id="modalTitle">Add Administrator</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="adminId"/>
          <div class="mb-3">
            <label class="form-label fw-semibold">Admin ID *</label>
            <input type="text" id="fAdminId" class="form-control" placeholder="e.g. ADM-003"/>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Access Level</label>
            <select id="fAccessLevel" class="form-select">
              <option value="Full">Full</option>
              <option value="Read-Only">Read-Only</option>
              <option value="Restricted">Restricted</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Department</label>
            <input type="text" id="fDepartment" class="form-control" placeholder="e.g. Operations"/>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-danger fw-semibold" onclick="saveAdmin()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API = '/api/administrators';
    let modal, toast;

    document.addEventListener('DOMContentLoaded', () => {
      modal = new bootstrap.Modal(document.getElementById('adminModal'));
      toast = new bootstrap.Toast(document.getElementById('toast'));
      loadAdmins();
    });

    function showToast(msg, type = 'success') {
      const el = document.getElementById('toast');
      el.className = `toast align-items-center text-white border-0 bg-${type}`;
      document.getElementById('toast-msg').textContent = msg;
      toast.show();
    }

    async function loadAdmins() {
      document.getElementById('searchInput').value = '';
      document.getElementById('spinner').classList.remove('d-none');
      document.getElementById('tableCard').classList.add('d-none');
      document.getElementById('emptyMsg').classList.add('d-none');
      try {
        const res = await fetch(API);
        renderTable(await res.json());
      } catch { showToast('Failed to load administrators.', 'danger'); }
    }

    async function searchAdmins() {
      const q = document.getElementById('searchInput').value.trim();
      if (!q) { loadAdmins(); return; }
      try {
        const res = await fetch(`${API}/search?department=${encodeURIComponent(q)}`);
        renderTable(await res.json());
      } catch { showToast('Search failed.', 'danger'); }
    }

    function renderTable(data) {
      document.getElementById('spinner').classList.add('d-none');
      if (!data.length) { document.getElementById('emptyMsg').classList.remove('d-none'); return; }
      document.getElementById('tableCard').classList.remove('d-none');
      document.getElementById('adminsTable').innerHTML = data.map(a => `
        <tr>
          <td>${a.id}</td>
          <td><span class="badge bg-danger-subtle text-danger-emphasis px-2">${a.adminId}</span></td>
          <td>${a.accessLevel}</td>
          <td class="fw-semibold">${a.department}</td>
          <td>
            <button class="btn btn-outline-primary btn-action me-1" onclick="editAdmin(${a.id})"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-outline-danger btn-action" onclick="deleteAdmin(${a.id})"><i class="bi bi-trash"></i></button>
          </td>
        </tr>`).join('');
    }

    function openModal(a = null) {
      document.getElementById('modalTitle').textContent = a ? 'Edit Administrator' : 'Add Administrator';
      document.getElementById('adminId').value = a?.id || '';
      document.getElementById('fAdminId').value = a?.adminId || '';
      document.getElementById('fAccessLevel').value = a?.accessLevel || 'Full';
      document.getElementById('fDepartment').value = a?.department || '';
      modal.show();
    }

    async function editAdmin(id) {
      const res = await fetch(`${API}/${id}`);
      openModal(await res.json());
    }

    async function saveAdmin() {
      const id = document.getElementById('adminId').value;
      const body = {
        adminId: document.getElementById('fAdminId').value,
        accessLevel: document.getElementById('fAccessLevel').value,
        department: document.getElementById('fDepartment').value
      };
      if (!body.adminId) { alert('Admin ID is required.'); return; }
      try {
        const res = await fetch(id ? `${API}/${id}` : API, {
          method: id ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error();
        modal.hide();
        showToast(id ? 'Administrator updated!' : 'Administrator created!');
        loadAdmins();
      } catch { showToast('Save failed.', 'danger'); }
    }

    async function deleteAdmin(id) {
      if (!confirm('Delete this administrator?')) return;
      try {
        const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error();
        showToast('Administrator deleted!', 'warning');
        loadAdmins();
      } catch { showToast('Delete failed.', 'danger'); }
    }
  </script>
</body>
</html>
