<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EventHub – Users</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    body { background:#f8f9fa; }
    .page-header { background:linear-gradient(135deg,#1a1a2e,#0d6efd); color:#fff; padding:40px 0 30px; }
    .table th { background:#0d6efd; color:#fff; }
    .btn-action { padding:3px 10px; font-size:.8rem; }
    .badge-role-attendee { background:#e9f0ff; color:#0d6efd; }
    .badge-role-admin { background:#fff3cd; color:#856404; }
  </style>
</head>
<body>

  <nav class="navbar navbar-dark" style="background:#1a1a2e;">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-calendar-event me-2"></i>EventHub</a>
      <div class="d-flex gap-2">
        <a href="events.html" class="btn btn-outline-light btn-sm">Events</a>
        <a href="users.html" class="btn btn-primary btn-sm">Users</a>
        <a href="subscriptions.html" class="btn btn-outline-light btn-sm">Subscriptions</a>
        <a href="administrators.html" class="btn btn-outline-light btn-sm">Admins</a>
      </div>
    </div>
  </nav>

  <div class="page-header">
    <div class="container">
      <h2><i class="bi bi-people me-2"></i>Users</h2>
      <p class="mb-0 opacity-75">Manage platform users &mdash; Author: Syed Rayan Hashmi (ID: 764000072)</p>
    </div>
  </div>

  <div class="container py-4">

    <div class="position-fixed top-0 end-0 p-3" style="z-index:9999">
      <div id="toast" class="toast align-items-center text-white border-0" role="alert">
        <div class="d-flex">
          <div class="toast-body" id="toast-msg"></div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <div class="input-group" style="max-width:340px;">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input type="text" id="searchInput" class="form-control" placeholder="Search by name..." oninput="searchUsers()"/>
        <button class="btn btn-outline-secondary" onclick="loadUsers()">Clear</button>
      </div>
      <button class="btn btn-primary fw-semibold" onclick="openModal()"><i class="bi bi-plus-lg me-1"></i>Add User</button>
    </div>

    <div id="spinner" class="text-center py-5"><div class="spinner-border text-primary"></div></div>

    <div class="card shadow-sm d-none" id="tableCard">
      <div class="card-body p-0">
        <table class="table table-hover mb-0 align-middle">
          <thead>
            <tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Actions</th></tr>
          </thead>
          <tbody id="usersTable"></tbody>
        </table>
      </div>
    </div>
    <div id="emptyMsg" class="text-center text-muted py-5 d-none">No users found.</div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="userModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title" id="modalTitle">Add User</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="userId"/>
          <div class="mb-3">
            <label class="form-label fw-semibold">Name *</label>
            <input type="text" id="fName" class="form-control" placeholder="Full name"/>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Email *</label>
            <input type="email" id="fEmail" class="form-control" placeholder="user@example.com"/>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Role</label>
            <select id="fRole" class="form-select">
              <option value="attendee">Attendee</option>
              <option value="admin">Admin</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary fw-semibold" onclick="saveUser()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API = '/api/users';
    let modal, toast;

    document.addEventListener('DOMContentLoaded', () => {
      modal = new bootstrap.Modal(document.getElementById('userModal'));
      toast = new bootstrap.Toast(document.getElementById('toast'));
      loadUsers();
    });

    function showToast(msg, type = 'success') {
      const el = document.getElementById('toast');
      el.className = `toast align-items-center text-white border-0 bg-${type}`;
      document.getElementById('toast-msg').textContent = msg;
      toast.show();
    }

    async function loadUsers() {
      document.getElementById('searchInput').value = '';
      document.getElementById('spinner').classList.remove('d-none');
      document.getElementById('tableCard').classList.add('d-none');
      document.getElementById('emptyMsg').classList.add('d-none');
      try {
        const res = await fetch(API);
        renderTable(await res.json());
      } catch { showToast('Failed to load users.', 'danger'); }
    }

    async function searchUsers() {
      const q = document.getElementById('searchInput').value.trim();
      if (!q) { loadUsers(); return; }
      try {
        const res = await fetch(`${API}/search?name=${encodeURIComponent(q)}`);
        renderTable(await res.json());
      } catch { showToast('Search failed.', 'danger'); }
    }

    function renderTable(data) {
      document.getElementById('spinner').classList.add('d-none');
      if (!data.length) { document.getElementById('emptyMsg').classList.remove('d-none'); return; }
      document.getElementById('tableCard').classList.remove('d-none');
      document.getElementById('usersTable').innerHTML = data.map(u => `
        <tr>
          <td>${u.id}</td>
          <td class="fw-semibold">${u.name}</td>
          <td>${u.email}</td>
          <td><span class="badge badge-role-${u.role} px-2 py-1 rounded-pill">${u.role}</span></td>
          <td>
            <button class="btn btn-outline-primary btn-action me-1" onclick="editUser(${u.id})"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-outline-danger btn-action" onclick="deleteUser(${u.id})"><i class="bi bi-trash"></i></button>
          </td>
        </tr>`).join('');
    }

    function openModal(user = null) {
      document.getElementById('modalTitle').textContent = user ? 'Edit User' : 'Add User';
      document.getElementById('userId').value = user?.id || '';
      document.getElementById('fName').value = user?.name || '';
      document.getElementById('fEmail').value = user?.email || '';
      document.getElementById('fRole').value = user?.role || 'attendee';
      modal.show();
    }

    async function editUser(id) {
      const res = await fetch(`${API}/${id}`);
      openModal(await res.json());
    }

    async function saveUser() {
      const id = document.getElementById('userId').value;
      const body = {
        name: document.getElementById('fName').value,
        email: document.getElementById('fEmail').value,
        role: document.getElementById('fRole').value
      };
      if (!body.name || !body.email) { alert('Name and email are required.'); return; }
      try {
        const res = await fetch(id ? `${API}/${id}` : API, {
          method: id ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error();
        modal.hide();
        showToast(id ? 'User updated!' : 'User created!');
        loadUsers();
      } catch { showToast('Save failed.', 'danger'); }
    }

    async function deleteUser(id) {
      if (!confirm('Delete this user?')) return;
      try {
        const res = await fetch(`${API}/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error();
        showToast('User deleted!', 'warning');
        loadUsers();
      } catch { showToast('Delete failed.', 'danger'); }
    }
  </script>
</body>
</html>
